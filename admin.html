<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administración — Banderas de España</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo-area">
            <div class="flag-icon">🇪🇸</div>

            <div>
                <h1>ADMINISTRACIÓN</h1>
                <p>Banderas de España</p>
            </div>
        </div>
    </header>


    <main class="admin-container">

        <!-- LOGIN -->

        <section class="admin-login" id="loginSection">

            <h2>🔐 Acceso de administrador</h2>

            <p>
                Inicia sesión para acceder a la administración.
            </p>

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Correo electrónico"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    required
                >

                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

            <p id="loginMessage"></p>

        </section>


        <!-- PANEL -->

        <section
            class="admin-panel"
            id="adminPanel"
            style="display:none;"
        >

            <div class="admin-top">

                <div>
                    <h2>🛠️ Panel de administración</h2>

                    <p id="welcomeMessage"></p>
                </div>

                <button id="logoutButton">
                    Cerrar sesión
                </button>

            </div>


            <hr>


            <div class="pending-header">

                <h3>
                    🟡 Banderas en revisión
                </h3>

                <span id="pendingCount">
                    0
                </span>

            </div>


            <div id="pendingFlags">

                <p>
                    Cargando banderas...
                </p>

            </div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="admin.js"></script>

</body>

</html>
